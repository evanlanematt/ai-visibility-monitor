# Optional: run the monitor in GitHub Actions instead of on your own machine.
# Add OPENAI_API_KEY / ANTHROPIC_API_KEY / PERPLEXITY_API_KEY as repository secrets.
# The database and report are committed back so history accumulates.
name: Weekly AI visibility check
on:
  schedule:
    - cron: "40 12 * * 1"   # Mondays 12:40 UTC (7:40 AM New York in winter)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check setup
        id: setup
        run: |
          if [ -f config.toml ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No config.toml yet: copy config.example.toml to config.toml, add your clients, and commit it. Skipping this run."; echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Run check
        if: steps.setup.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MONITOR_WEBHOOK_URL: ${{ secrets.MONITOR_WEBHOOK_URL }}
        run: python monitor.py run
      - name: Save history
        if: steps.setup.outputs.ready == 'true'
        run: |
          git config user.name "visibility-bot"
          git config user.email "visibility-bot@users.noreply.github.com"
          git add -f visibility.db report.html
          git commit -m "Weekly AI visibility check" || echo "No changes"
          git push
